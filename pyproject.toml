[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "murmur-dictation"
version = "0.1.0"
description = "Linux-native dictation prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
stt = ["faster-whisper"]
dev = ["pytest"]

[project.scripts]
murmur = "murmur.cli:main"

[tool.setuptools.packages.find]
include = ["murmur*"]
